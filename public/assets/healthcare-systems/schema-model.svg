<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Conceptual healthcare journey schema</title>
  <desc id="description">A sanitized entity relationship model connecting people, episodes, appointments, encounters, orders, invoices, payouts, messages, events, and audit records.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#668078"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#173e33" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#10241d}.sub{font:500 17px Inter,Arial,sans-serif;fill:#61736c}.eyebrow{font:800 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#1b6a50}.entity{font:800 16px Inter,Arial,sans-serif;fill:#10241d}.field{font:600 12px Inter,Arial,sans-serif;fill:#60736b}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#657970}.box{fill:#fff;stroke:#c8d3cd;stroke-width:2}.core{fill:#173e33;stroke:#173e33;stroke-width:2}.coreTitle{font:800 16px Inter,Arial,sans-serif;fill:#fff}.coreField{font:600 12px Inter,Arial,sans-serif;fill:#d5e4de}.soft{fill:#eef5f1;stroke:#c6d8cf;stroke-width:2}.coral{fill:#fff0e9;stroke:#e4a181;stroke-width:2}.line{fill:none;stroke:#668078;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#8aa096;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8faf8"/>
  <text x="80" y="72" class="eyebrow">SCHEMA DESIGN</text>
  <text x="80" y="120" class="title">The data model connects customer state to business outcomes</text>
  <text x="80" y="153" class="sub">Stable identifiers and explicit relationships make cross-journey analytics, auditability, and automation possible.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="240" width="260" height="150" rx="16" class="box"/>
    <text x="108" y="276" class="entity">Person</text><text x="108" y="307" class="field">person_id · identity</text><text x="108" y="332" class="field">consent · contact context</text><text x="108" y="357" class="field">created_at · updated_at</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="430" y="225" width="300" height="180" rx="16" class="core"/>
    <text x="460" y="265" class="coreTitle">Journey episode</text><text x="460" y="298" class="coreField">episode_id · person_id</text><text x="460" y="325" class="coreField">journey_type · current_state</text><text x="460" y="352" class="coreField">started_at · completed_at</text><text x="460" y="379" class="coreField">version · source</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="205" width="280" height="150" rx="16" class="soft"/>
    <text x="850" y="244" class="entity">Appointment</text><text x="850" y="275" class="field">appointment_id · episode_id</text><text x="850" y="300" class="field">slot_id · provider_id</text><text x="850" y="325" class="field">state · scheduled_at</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="820" y="390" width="280" height="150" rx="16" class="soft"/>
    <text x="850" y="429" class="entity">Encounter</text><text x="850" y="460" class="field">encounter_id · appointment_id</text><text x="850" y="485" class="field">outcome · completed_at</text><text x="850" y="510" class="field">clinical reference only</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="205" width="330" height="150" rx="16" class="box"/>
    <text x="1220" y="244" class="entity">Order &amp; fulfilment</text><text x="1220" y="275" class="field">order_id · episode_id</text><text x="1220" y="300" class="field">fulfilment_state · amount</text><text x="1220" y="325" class="field">vendor_ref · timestamps</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1190" y="390" width="330" height="150" rx="16" class="box"/>
    <text x="1220" y="429" class="entity">Invoice &amp; payout ledger</text><text x="1220" y="460" class="field">ledger_id · source_ref</text><text x="1220" y="485" class="field">rule_version · amount · state</text><text x="1220" y="510" class="field">approval · transaction_ref</text>
  </g>

  <path d="M340 315 H430" class="line"/><path d="M730 290 H820" class="line"/><path d="M960 355 V390" class="line"/><path d="M730 335 H770 V280 H1190" class="line"/><path d="M1100 465 H1190" class="line"/>

  <g filter="url(#shadow)">
    <rect x="80" y="640" width="310" height="142" rx="16" class="coral"/>
    <text x="110" y="679" class="entity">Message / activity</text><text x="110" y="710" class="field">activity_id · episode_id</text><text x="110" y="735" class="field">channel · intent · outcome</text><text x="110" y="760" class="field">human / automation owner</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="640" width="310" height="142" rx="16" class="box"/>
    <text x="500" y="679" class="entity">Scheduled event</text><text x="500" y="710" class="field">event_id · aggregate_id</text><text x="500" y="735" class="field">event_type · due_at · state</text><text x="500" y="760" class="field">idempotency_key</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="860" y="640" width="310" height="142" rx="16" class="box"/>
    <text x="890" y="679" class="entity">Audit event</text><text x="890" y="710" class="field">audit_id · actor_id</text><text x="890" y="735" class="field">entity · before / after</text><text x="890" y="760" class="field">request_id · occurred_at</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1250" y="640" width="270" height="142" rx="16" class="soft"/>
    <text x="1280" y="679" class="entity">Metric event</text><text x="1280" y="710" class="field">event_name · actor</text><text x="1280" y="735" class="field">journey_id · timestamp</text><text x="1280" y="760" class="field">dimensions · properties</text>
  </g>
  <path d="M580 405 V590 H235 V640" class="dash"/><path d="M580 405 V640" class="dash"/><path d="M650 405 V590 H1015 V640" class="dash"/><path d="M700 405 V570 H1385 V640" class="dash"/>

  <text x="80" y="842" class="tiny">Design heuristics: one stable ID per entity · explicit foreign keys · indexed query paths · immutable financial/audit history · JSON only for genuinely flexible attributes · migrations for controlled change.</text>
</svg>
