<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Healthcare journey system context</title>
  <desc id="description">A sanitized conceptual architecture showing users, experience channels, domain services, data infrastructure, integrations, and observability.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#173e33" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6c8178"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#10241d}.sub{font:500 17px Inter,Arial,sans-serif;fill:#61736c}.label{font:700 17px Inter,Arial,sans-serif;fill:#10241d}.small{font:600 13px Inter,Arial,sans-serif;fill:#50665d}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#657970}.eyebrow{font:800 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#1b6a50}.box{fill:#fff;stroke:#c8d3cd;stroke-width:2}.soft{fill:#eef5f1;stroke:#c6d8cf;stroke-width:2}.green{fill:#173e33;stroke:#173e33;stroke-width:2}.greenText{font:700 16px Inter,Arial,sans-serif;fill:#fff}.coral{fill:#fff0e9;stroke:#e4a181;stroke-width:2}.line{fill:none;stroke:#6c8178;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#86a497;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8faf8"/>
  <text x="80" y="72" class="eyebrow">SANITIZED CONCEPTUAL VIEW</text>
  <text x="80" y="120" class="title">From a customer action to a reliable care journey</text>
  <text x="80" y="153" class="sub">Product surfaces, domain logic, data, asynchronous work, integrations, and measurement operate as one system.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="205" width="220" height="170" rx="18" class="box"/>
    <text x="110" y="240" class="eyebrow">PEOPLE</text>
    <text x="110" y="284" class="label">Patient</text>
    <text x="110" y="321" class="label">Care provider</text>
    <text x="110" y="358" class="label">Care &amp; ops teams</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="380" y="205" width="250" height="170" rx="18" class="soft"/>
    <text x="410" y="240" class="eyebrow">EXPERIENCES</text>
    <text x="410" y="284" class="label">Web &amp; mobile journeys</text>
    <text x="410" y="321" class="label">Internal products</text>
    <text x="410" y="358" class="label">Messaging interfaces</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="205" width="800" height="330" rx="20" class="box"/>
    <rect x="720" y="205" width="800" height="64" rx="20" class="green"/>
    <rect x="720" y="245" width="800" height="24" fill="#173e33"/>
    <text x="752" y="246" class="greenText">Versioned, authenticated API boundary</text>

    <rect x="752" y="300" width="220" height="82" rx="12" class="soft"/>
    <text x="774" y="334" class="label">Identity &amp; access</text>
    <text x="774" y="360" class="tiny">roles · context · consent</text>

    <rect x="992" y="300" width="220" height="82" rx="12" class="soft"/>
    <text x="1014" y="334" class="label">Journey engine</text>
    <text x="1014" y="360" class="tiny">episodes · eligibility · state</text>

    <rect x="1232" y="300" width="256" height="82" rx="12" class="soft"/>
    <text x="1254" y="334" class="label">Appointments</text>
    <text x="1254" y="360" class="tiny">slots · holds · booking · attendance</text>

    <rect x="752" y="410" width="220" height="82" rx="12" class="soft"/>
    <text x="774" y="444" class="label">Fulfilment</text>
    <text x="774" y="470" class="tiny">orders · shipment states</text>

    <rect x="992" y="410" width="220" height="82" rx="12" class="soft"/>
    <text x="1014" y="444" class="label">Billing &amp; payouts</text>
    <text x="1014" y="470" class="tiny">rules · ledger · approvals</text>

    <rect x="1232" y="410" width="256" height="82" rx="12" class="soft"/>
    <text x="1254" y="444" class="label">Outbound &amp; tasks</text>
    <text x="1254" y="470" class="tiny">messages · callbacks · escalation</text>
  </g>

  <path d="M300 290 H380" class="line"/>
  <path d="M630 290 H720" class="line"/>

  <g filter="url(#shadow)">
    <rect x="80" y="620" width="310" height="150" rx="18" class="box"/>
    <text x="110" y="655" class="eyebrow">DURABLE DATA</text>
    <text x="110" y="700" class="label">Domain databases</text>
    <text x="110" y="731" class="small">entities · history · audit trail</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="420" y="620" width="260" height="150" rx="18" class="box"/>
    <text x="450" y="655" class="eyebrow">FAST STATE</text>
    <text x="450" y="700" class="label">Cache &amp; locks</text>
    <text x="450" y="731" class="small">holds · limits · deduplication</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="620" width="300" height="150" rx="18" class="coral"/>
    <text x="740" y="655" class="eyebrow">ASYNCHRONOUS WORK</text>
    <text x="740" y="700" class="label">Events, queues &amp; timers</text>
    <text x="740" y="731" class="small">retries · outbox · dead letters</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1040" y="620" width="270" height="150" rx="18" class="box"/>
    <text x="1070" y="655" class="eyebrow">INTEGRATIONS</text>
    <text x="1070" y="700" class="label">Partner adapters</text>
    <text x="1070" y="731" class="small">payments · comms · calendar</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1340" y="620" width="180" height="150" rx="18" class="green"/>
    <text x="1366" y="655" class="eyebrow" fill="#8fe2bd">OBSERVE</text>
    <text x="1366" y="700" class="greenText">Logs &amp; traces</text>
    <text x="1366" y="729" class="greenText">Funnels &amp; SLAs</text>
  </g>

  <path d="M880 535 V590 H235 V620" class="dash"/>
  <path d="M960 535 V580 H550 V620" class="dash"/>
  <path d="M1070 535 V620" class="dash"/>
  <path d="M1240 535 V585 H1175 V620" class="dash"/>
  <path d="M1390 535 V620" class="dash"/>

  <text x="80" y="838" class="tiny">Conceptual architecture only. It communicates product and reliability decisions—not internal endpoints, infrastructure topology, or proprietary implementation details.</text>
</svg>
