<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Journey orchestration and reliability</title>
  <desc id="description">A journey state model linked to events, timers, queues, messaging, tasks, analytics, and reliability controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#668078"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-color="#173e33" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#10241d}.sub{font:500 17px Inter,Arial,sans-serif;fill:#61736c}.eyebrow{font:800 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#1b6a50}.label{font:700 17px Inter,Arial,sans-serif;fill:#10241d}.small{font:600 13px Inter,Arial,sans-serif;fill:#5f726a}.tiny{font:600 12px Inter,Arial,sans-serif;fill:#657970}.box{fill:#fff;stroke:#c8d3cd;stroke-width:2}.soft{fill:#eef5f1;stroke:#c6d8cf;stroke-width:2}.dark{fill:#173e33;stroke:#173e33;stroke-width:2}.darkLabel{font:700 17px Inter,Arial,sans-serif;fill:#fff}.coral{fill:#fff0e9;stroke:#e4a181;stroke-width:2}.line{fill:none;stroke:#668078;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#7e998f;stroke-width:2;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8faf8"/>
  <text x="80" y="72" class="eyebrow">WORKFLOW &amp; EVENTS</text>
  <text x="80" y="120" class="title">A journey is a state machine with a clock</text>
  <text x="80" y="153" class="sub">State explains where the customer is; events explain what happened; timers and queues make the next action reliable.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="220" width="1440" height="230" rx="20" class="box"/>
    <text x="112" y="258" class="eyebrow">EXAMPLE REPEAT JOURNEY</text>
    <rect x="112" y="300" width="190" height="94" rx="14" class="soft"/><text x="137" y="341" class="label">Eligible</text><text x="137" y="367" class="small">follow-up becomes due</text>
    <rect x="352" y="300" width="190" height="94" rx="14" class="soft"/><text x="377" y="341" class="label">Bookable</text><text x="377" y="367" class="small">slot options available</text>
    <rect x="592" y="300" width="190" height="94" rx="14" class="soft"/><text x="617" y="341" class="label">Booked</text><text x="617" y="367" class="small">appointment confirmed</text>
    <rect x="832" y="300" width="190" height="94" rx="14" class="dark"/><text x="857" y="341" class="darkLabel">Completed</text><text x="857" y="367" class="small" fill="#d5e4de">care milestone consumed</text>
    <rect x="1072" y="300" width="190" height="94" rx="14" class="soft"/><text x="1097" y="341" class="label">Repeat due</text><text x="1097" y="367" class="small">next cycle scheduled</text>
    <rect x="1312" y="300" width="176" height="94" rx="14" class="coral"/><text x="1337" y="341" class="label">Exception</text><text x="1337" y="367" class="small">missed · cancelled</text>
    <path d="M302 347 H352" class="line"/><path d="M542 347 H592" class="line"/><path d="M782 347 H832" class="line"/><path d="M1022 347 H1072" class="line"/><path d="M1262 347 H1312" class="line"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="535" width="230" height="138" rx="16" class="box"/>
    <text x="108" y="570" class="eyebrow">DOMAIN EVENT</text><text x="108" y="612" class="label">Something happened</text><text x="108" y="641" class="small">booking.created</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="352" y="535" width="230" height="138" rx="16" class="coral"/>
    <text x="380" y="570" class="eyebrow">SCHEDULED EVENT</text><text x="380" y="612" class="label">Act at a future time</text><text x="380" y="641" class="small">reminder.due</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="624" y="535" width="230" height="138" rx="16" class="soft"/>
    <text x="652" y="570" class="eyebrow">QUEUE</text><text x="652" y="612" class="label">Distribute work</text><text x="652" y="641" class="small">retry without blocking</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="896" y="535" width="230" height="138" rx="16" class="box"/>
    <text x="924" y="570" class="eyebrow">CONSUMER</text><text x="924" y="612" class="label">Send / create / sync</text><text x="924" y="641" class="small">one idempotent action</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1168" y="535" width="352" height="138" rx="16" class="dark"/>
    <text x="1196" y="570" class="eyebrow" fill="#8fe2bd">OUTCOMES</text><text x="1196" y="612" class="darkLabel">Message · task · webhook · metric</text><text x="1196" y="641" class="small" fill="#d5e4de">human and system action stay traceable</text>
  </g>
  <path d="M310 604 H352" class="line"/><path d="M582 604 H624" class="line"/><path d="M854 604 H896" class="line"/><path d="M1126 604 H1168" class="line"/>
  <path d="M927 450 V498 H195 V535" class="dash"/>

  <rect x="80" y="748" width="1440" height="84" rx="14" fill="#edf3f0" stroke="#c8d3cd" stroke-width="2"/>
  <text x="112" y="781" class="eyebrow">FAILURE RAILS</text>
  <text x="112" y="810" class="small">Idempotency prevents duplicate outcomes · locks protect scarce slots · retries handle transient failures · dead letters retain failed work · audit history supports replay and investigation</text>
</svg>
